<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#15181d"/>
  <!-- 右側: 実測を示すバーの図版。装飾ではなく媒体の性格を表す -->
  <g opacity="0.9">
    <rect x="880" y="430" width="34" height="96"  fill="#235f6e"/>
    <rect x="926" y="386" width="34" height="140" fill="#235f6e"/>
    <rect x="972" y="316" width="34" height="210" fill="#b65c12"/>
    <rect x="1018" y="408" width="34" height="118" fill="#235f6e"/>
    <rect x="1064" y="352" width="34" height="174" fill="#235f6e"/>
    <line x1="868" y1="534" x2="1110" y2="534" stroke="#4a515c" stroke-width="2"/>
  </g>
  <!-- 猫の瞳のマーク -->
  <g transform="translate(868,112)">
    <path d="M0 48 Q72 -16 144 48 Q72 112 0 48 Z" fill="#faf8f5"/>
    <ellipse cx="72" cy="48" rx="30" ry="42" fill="#b65c12"/>
    <path d="M72 10 Q82 48 72 86 Q62 48 72 10 Z" fill="#15181d"/>
  </g>
  <text x="90" y="200" font-family="Noto Sans CJK JP" font-weight="700" font-size="40" fill="#b65c12" letter-spacing="6">猫用デバイス専門レビュー</text>
  <text x="90" y="320" font-family="Noto Sans CJK JP" font-weight="900" font-size="92" fill="#faf8f5" letter-spacing="-2">猫の道具を、</text>
  <text x="90" y="430" font-family="Noto Sans CJK JP" font-weight="900" font-size="92" fill="#faf8f5" letter-spacing="-2">実測で選ぶ。</text>
  <text x="90" y="530" font-family="Noto Sans CJK JP" font-weight="700" font-size="34" fill="#7d8591">騒音・猫砂の消費量・電気代を自分で測る</text>
  <text x="90" y="585" font-family="DejaVu Sans Mono" font-weight="700" font-size="30" fill="#b65c12" letter-spacing="2">neko-tech</text>
</svg>
