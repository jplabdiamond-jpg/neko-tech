name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 楽天APIから商品画像・価格を取得。Secret未設定ならスキップされる
      - name: Fetch product data (Rakuten)
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/fetch-rakuten.mjs

      - run: npm run build

      # プロジェクトが無ければ作る。既にあれば失敗するが無視して進む。
      # これによりダッシュボードでの事前作成が不要になる。
      - name: Ensure Pages project exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7969ecaa0a1b9bacae1861547c2ec3fe
        run: npx wrangler pages project create neko-tech --production-branch main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7969ecaa0a1b9bacae1861547c2ec3fe
          command: pages deploy dist --project-name=neko-tech
