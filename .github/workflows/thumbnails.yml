name: Generate thumbnails

# サムネイルはビルドのたびに作らない。AI生成は毎回結果が変わるうえ
# コストもかかるため、生成物をリポジトリにコミットして固定する。
# 記事を追加したあと、このワークフローを手動実行する。
on:
  workflow_dispatch:
    inputs:
      force:
        description: '既存のサムネイルも作り直す'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate thumbnails
        env:
          CLOUDFLARE_ACCOUNT_ID: 7969ecaa0a1b9bacae1861547c2ec3fe
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/make-thumbnails.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/thumbs
          git diff --staged --quiet || git commit -m "サムネイルを生成"
          git push
